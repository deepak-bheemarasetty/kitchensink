services:
  mongodb:
    image: mongo:8.0
    ports:
      - "27018:27017"
    volumes:
      - mongo_data:/data/db
      - ./mongo-init.js:/docker-entrypoint-initdb.d/01-seed-members.js:ro
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "quit(db.adminCommand('ping').ok ? 0 : 1)"]
      interval: 5s
      timeout: 3s
      retries: 20

  app:
    build: .
    ports:
      - "9080:9080"
    environment:
      MONGODB_URI: mongodb://mongodb:27017/kitchensink
    depends_on:
      mongodb:
        condition: service_healthy

volumes:
  mongo_data:
