# Load local secrets when running from the project root; environment variables take precedence.
spring.config.import=optional:file:.env[.properties]

# MongoDB
spring.mongodb.uri=${MONGODB_URI:mongodb://localhost:27017/kitchensink}
spring.data.mongodb.auto-index-creation=true

# Auth0 OIDC login and JWT validation. Configure values in the root .env file.
auth0.issuer-uri=${OIDC_ISSUER_URI}
auth0.client-id=${OIDC_CLIENT_ID}
auth0.client-secret=${OIDC_CLIENT_SECRET}
auth0.audience=${OIDC_AUDIENCE}
spring.security.oauth2.resourceserver.jwt.issuer-uri=${auth0.issuer-uri}
spring.security.oauth2.resourceserver.jwt.jwk-set-uri=${auth0.issuer-uri}.well-known/jwks.json
spring.security.oauth2.resourceserver.jwt.audiences=${auth0.audience}

# Spring Boot's generated in-memory user is not used with OIDC/JWT.
spring.autoconfigure.exclude=org.springframework.boot.security.autoconfigure.UserDetailsServiceAutoConfiguration

# Operational metrics; endpoints remain protected by application authentication.
management.endpoints.web.exposure.include=health,metrics
management.endpoint.health.show-details=never
management.metrics.tags.application=kitchensink

# Server
server.port=9080
server.servlet.context-path=/kitchensink
server.servlet.session.timeout=30m
