# MongoDB
spring.mongodb.uri=${MONGODB_URI:mongodb://localhost:27017/kitchensink}
spring.data.mongodb.auto-index-creation=true

# Local development credentials. Override these environment variables outside this setup.
spring.security.user.name=${SPRING_SECURITY_USER_NAME:demo.user@gmail.com}
spring.security.user.password=${SPRING_SECURITY_USER_PASSWORD:password@001}

# Operational metrics; endpoints remain protected by application authentication.
management.endpoints.web.exposure.include=health,metrics
management.endpoint.health.show-details=never
management.metrics.tags.application=kitchensink

# Server
server.port=9080
server.servlet.context-path=/kitchensink
