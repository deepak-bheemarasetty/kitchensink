# Load local secrets when running from the project root; environment variables take precedence.
spring.config.import=optional:file:.env[.properties]
spring.profiles.default=dev

# Root logging level; set LOG_LEVEL in .env or the process environment.
logging.level.root=${LOG_LEVEL:INFO}

# MongoDB base connection and database configuration
spring.mongodb.uri=${MONGODB_URI:mongodb://localhost:27017}
spring.mongodb.database=${MONGODB_DATABASE:kitchensink}
spring.data.mongodb.auto-index-creation=true

# Auth0 OIDC login and JWT validation. Configure values in the root .env file.
auth0.issuer-uri=${OIDC_ISSUER_URI:https://example.auth0.com/}
auth0.client-id=${OIDC_CLIENT_ID:local-client-id}
auth0.client-secret=${OIDC_CLIENT_SECRET:local-client-secret}
auth0.audience=${OIDC_AUDIENCE:https://example-api}
spring.security.oauth2.resourceserver.jwt.issuer-uri=${auth0.issuer-uri}
spring.security.oauth2.resourceserver.jwt.jwk-set-uri=${auth0.issuer-uri}.well-known/jwks.json
spring.security.oauth2.resourceserver.jwt.audiences=${auth0.audience}

# Operational metrics; endpoints remain protected by application authentication.
management.endpoints.web.exposure.include=health,info,metrics
management.endpoint.health.show-details=never
management.metrics.tags.application=kitchensink

# Request size limits (VULN-011)
spring.servlet.multipart.max-request-size=64KB
server.tomcat.max-http-post-size=65536
server.tomcat.max-http-request-header-size=8192

# Session Cookie Security (VULN-031 - lax for OAuth redirects, secure only in HTTPS/prod)
server.servlet.session.cookie.same-site=lax
server.servlet.session.cookie.secure=false
server.servlet.session.cookie.http-only=true

# Server
server.port=9080
server.servlet.context-path=/kitchensink
server.servlet.session.timeout=30m
