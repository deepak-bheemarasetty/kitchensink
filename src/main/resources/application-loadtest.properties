# Load-testing environment profile
spring.mongodb.database=kitchensink_loadtest
server.port=9081

# Mock JWKS Authentication endpoint
auth0.issuer-uri=http://localhost:9089/
auth0.audience=https://kitchensink-api
spring.security.oauth2.resourceserver.jwt.issuer-uri=http://localhost:9089/
spring.security.oauth2.resourceserver.jwt.jwk-set-uri=http://localhost:9089/.well-known/jwks.json
spring.security.oauth2.resourceserver.jwt.audiences=https://kitchensink-api

