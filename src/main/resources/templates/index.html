<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
  <head>
    <meta charset="UTF-8" />
    <title>Kitchen Sink Members</title>
    <link rel="stylesheet" th:href="@{/css/styles.css}" />
  </head>
  <body>
    <main class="container">
      <header>
        <h1>Kitchen Sink Members</h1>
      </header>

      <div th:if="${successMessage != null}" class="alert success" th:text="${successMessage}"></div>

      <section aria-labelledby="registration-heading">
        <h2 id="registration-heading">Register a Member</h2>
        <form th:action="@{/members}" th:object="${member}" method="post" novalidate>
          <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />
          <div th:if="${#fields.hasAnyErrors()}" class="alert error">
            <ul>
              <li th:each="err : ${#fields.allErrors()}" th:text="${err}"></li>
            </ul>
          </div>

          <label for="name">Name</label>
          <input id="name" type="text" th:field="*{name}" maxlength="25" required
                 aria-describedby="name-client-error" />
          <p id="name-client-error" class="client-error" aria-live="polite"></p>
          <div class="field-error" th:if="${#fields.hasErrors('name')}" th:errors="*{name}"></div>

          <label for="email">Email</label>
          <input id="email" type="email" th:field="*{email}" required
                 aria-describedby="email-client-error" />
          <p id="email-client-error" class="client-error" aria-live="polite"></p>
          <div class="field-error" th:if="${#fields.hasErrors('email')}" th:errors="*{email}"></div>

          <label for="phoneNumber">Phone Number</label>
          <input id="phoneNumber" type="tel" th:field="*{phoneNumber}" inputmode="numeric"
                 minlength="8" maxlength="12" required
                 aria-describedby="phoneNumber-client-error" />
          <p id="phoneNumber-client-error" class="client-error" aria-live="polite"></p>
          <div class="field-error" th:if="${#fields.hasErrors('phoneNumber')}"
               th:errors="*{phoneNumber}"></div>

          <button type="submit" class="primary">Create Member</button>
        </form>
      </section>

      <section aria-labelledby="featured-members-heading">
        <h2 id="featured-members-heading">Most Viewed Members</h2>
        <table>
          <thead>
            <tr>
              <th>Name</th>
              <th>Email</th>
              <th>Details</th>
            </tr>
          </thead>
          <tbody>
            <tr th:if="${#lists.isEmpty(featuredMembers)}">
              <td colspan="3">No members found.</td>
            </tr>
            <tr th:each="member : ${featuredMembers}">
              <td th:text="${member.name}">Jane Doe</td>
              <td th:text="${member.email}">jane@example.com</td>
              <td><a th:href="@{/members(selected=${member.id})}">View</a></td>
            </tr>
          </tbody>
        </table>
        <a class="primary" th:href="@{/members}">Show All Members</a>
      </section>
    </main>
    <script th:src="@{/js/member-validation.js}" defer></script>
  </body>
</html>
