<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="csrf-token" th:content="${_csrf.token}"><meta name="csrf-header" th:content="${_csrf.headerName}"><meta name="api-base" th:content="@{/api/v1}"><title>Members | Kitchensink</title><link rel="stylesheet" th:href="@{/css/styles.css}"><script defer th:src="@{/js/members-ui.js}"></script></head>
<body th:attr="data-can-update=${canUpdate},data-can-delete=${canDelete},data-username=${username}"><a class="skip-link" href="#main">Skip to content</a><div class="app-shell"><header class="topbar"><button class="menu-toggle" type="button" aria-expanded="false" aria-controls="primary-nav">☰ <span class="sr-only">Open navigation</span></button><div class="brand"><span class="brand-mark">K</span> Kitchensink</div><div class="profile"><span class="avatar" aria-hidden="true" th:text="${#strings.substring(username,0,1).toUpperCase()}">U</span><span class="profile-name" th:text="${username}">user</span><form th:action="@{/logout}" method="post"><input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"><button class="text-button" type="submit">Sign out</button></form></div></header><div class="workspace"><nav id="primary-nav" class="sidebar" aria-label="Primary navigation"><a class="nav-link active" th:if="${permissions.contains('member:view')}" th:href="@{/members}">Members</a><a class="nav-link" th:if="${canManageUsers}" th:href="@{/users}">Users</a><a class="nav-link" th:if="${canManageRoles}" th:href="@{/roles}">Roles</a></nav><main id="main" class="page-content"><div class="page-heading"><div><p class="eyebrow">DIRECTORY</p><h1>Members</h1><p class="subheading">Search and manage your member directory.</p></div><button id="add-member" class="primary" type="button" th:if="${canCreate}"><span aria-hidden="true">＋</span> Add member</button></div><section class="toolbar" aria-label="Member filters"><label class="search-box"><span aria-hidden="true">⌕</span><input id="search" type="search" placeholder="Search name or email" aria-label="Search members"></label><label class="filter-label">Status <select id="status"><option value="">All statuses</option><option value="active">Active</option><option value="inactive">Inactive</option></select></label><button id="clear-filters" class="button-secondary" type="button">Clear filters</button><span id="result-count" class="result-count" aria-live="polite"></span></section><div id="notice" class="notice" role="status" hidden></div><section class="table-card" aria-label="Member list"><div class="table-wrap"><table class="data-table"><thead><tr><th scope="col">Name</th><th scope="col" class="hide-medium">Member ID</th><th scope="col">Email</th><th scope="col" class="hide-medium">Phone</th><th scope="col">Status</th><th scope="col" th:if="${canUpdate or canDelete}">Actions</th></tr></thead><tbody id="member-rows"><tr><td colspan="6" class="loading-cell">Loading members…</td></tr></tbody></table></div><div id="member-cards" class="member-cards"></div><footer class="table-footer"><span id="page-note">Loading directory…</span><button id="load-more" class="button-secondary" type="button" hidden>Load more</button></footer></section></main></div></div><dialog id="member-dialog" class="drawer-dialog" aria-labelledby="drawer-title"><div class="drawer"><div class="drawer-header"><div><p class="eyebrow">MEMBER DETAILS</p><h2 id="drawer-title">Add member</h2></div><button type="button" class="icon-button" data-close aria-label="Close">×</button></div><form id="member-form"><input type="hidden" id="member-id"><input type="hidden" id="member-version"><label for="firstName">First name <span class="required">*</span></label><input id="firstName" name="firstName" autocomplete="given-name" required maxlength="60"><small class="field-error" data-error="firstName"></small><label for="lastName">Last name</label><input id="lastName" name="lastName" autocomplete="family-name" maxlength="60"><small class="field-error" data-error="lastName"></small><label for="email">Email <span class="required">*</span></label><input id="email" name="email" type="email" autocomplete="off" required maxlength="254"><small class="field-error" data-error="email"></small><label for="countryCode">Country code</label><input id="countryCode" name="countryCode" type="text" autocomplete="off" placeholder="1" maxlength="4"><small class="field-error" data-error="countryCode"></small><label for="phone">Phone <span class="required">*</span></label><input id="phone" name="phone" type="tel" autocomplete="off" placeholder="2125551212" required maxlength="14"><small class="field-error" data-error="phone"></small><div class="status-field"><label for="member-status">Status</label><select id="member-status" name="status"><option value="active">Active</option><option value="inactive">Inactive</option></select></div><div class="drawer-actions"><button type="button" class="button-secondary" data-close>Cancel</button><button class="primary" type="submit">Save member</button></div></form></div></dialog><dialog id="confirm-dialog" class="confirm-dialog"><form method="dialog"><h2>Delete member?</h2><p id="confirm-message"></p><div class="drawer-actions"><button class="button-secondary" value="cancel">Cancel</button><button class="danger-button" value="confirm">Delete member</button></div></form></dialog></body></html>
