<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>All Members</title>
    <link rel="stylesheet" th:href="@{/css/styles.css}" />
  </head>
  <body>
    <main class="container">
      <header class="page-header">
        <h1>All Members</h1>
        <a class="button-secondary" th:href="@{/}">Home</a>
      </header>

      <div class="member-browser single-pane-browser">
        <section class="member-list-pane" aria-labelledby="member-list-heading">
          <h2 id="member-list-heading">Members</h2>
          <form class="data-table-toolbar" th:action="@{/members}" method="get">
            <label for="member-filter">Filter by email prefix (minimum 4 characters)</label>
            <input id="member-filter" name="email" type="search" minlength="4" th:value="${searchEmail}" placeholder="Starts with…" aria-describedby="member-filter-error" />
            <p id="member-filter-error" class="client-error" aria-live="polite"></p>
            <button type="submit" class="button-secondary">Filter</button>
            <a class="button-secondary" th:if="${!#strings.isEmpty(searchEmail)}" th:href="@{/members}">Clear</a>
          </form>

          <table id="members-table" class="data-table">
            <thead>
              <tr>
                <th>Email</th>
                <th>Name</th>
                <th>Phone Number</th>
              </tr>
            </thead>
            <tbody>
              <tr th:if="${#lists.isEmpty(members)}">
                <td colspan="3">No members found.</td>
              </tr>
              <tr th:each="member : ${members}">
                <td th:text="${member.email}">jane@example.com</td>
                <td th:text="${member.name}">Jane Doe</td>
                <td th:text="${member.phoneNumber}">2125551234</td>
              </tr>
            </tbody>
          </table>

          <nav class="pagination" th:if="${cursorPage != null}" aria-label="Member pages">
            <a class="page-arrow" th:if="${cursorPage.hasPrevious}"
               th:href="@{/members(beforeEmail=${cursorPage.previousEmail}, email=${searchEmail})}"
               aria-label="Previous page">‹ Previous</a>
            <a class="page-arrow" th:if="${cursorPage.hasNext}"
               th:href="@{/members(afterEmail=${cursorPage.nextEmail}, email=${searchEmail})}"
               aria-label="Next page">Next ›</a>
          </nav>
        </section>

      </div>
    </main>

    <div th:if="${searchNotFound}" class="modal-backdrop" role="presentation">
      <section class="modal" role="alertdialog" aria-modal="true"
               aria-labelledby="search-warning-title"
               aria-describedby="search-warning-message">
        <h2 id="search-warning-title">Member Not Found</h2>
        <p id="search-warning-message">
          No member email starts with <strong th:text="${searchEmail}">name</strong>.
        </p>
        <a class="primary" th:href="@{/members}">Close</a>
      </section>
    </div>
    <script th:src="@{/js/member-filter-validation.js}" defer></script>
  </body>
</html>
